<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0907" />
    <title>Galla — Tea Shop Billing</title>
    <script>
      try {
        var th = localStorage.getItem('chai-pos:theme');
        var colors = { light: '#f5efe6', green: '#07120d' };
        if (colors[th]) {
          document.documentElement.dataset.theme = th;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', colors[th]);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
